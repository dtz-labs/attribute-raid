name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release TAP binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile TAP file
        run: make

      - name: Package TAP file
        run: |
          set -eu
          mkdir -p dist
          zip -j "dist/attribute-raid-${GITHUB_REF_NAME}-tap.zip" \
            build/attribute-raid.tap
          unzip -l "dist/attribute-raid-${GITHUB_REF_NAME}-tap.zip"

      - name: Publish beta GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Attribute Raid ${GITHUB_REF_NAME} (Beta)" \
              --notes "Beta release of Attribute Raid. The core gameplay is playable, but level progression and final balancing are not complete yet." \
              --prerelease \
              --verify-tag
          fi
